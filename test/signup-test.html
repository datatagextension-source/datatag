<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DataTag test signup</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px; font: inherit; }
    button { margin-top: 16px; padding: 8px 14px; font: inherit; }
    p { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Fake signup</h1>
  <p>Simulates common tracker behaviour using harmless endpoints (httpbin.org, example.org, example.net).
     Use a made-up email like <code>jane.test@example.com</code>.</p>
  <form id="f">
    <label>Email <input type="email" name="email" id="email"></label>
    <label>Phone <input type="tel" name="phone" id="phone"></label>
    <button>Create account</button>
  </form>
  <script>
    const sha256 = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))]
      .map((b) => b.toString(16).padStart(2, '0')).join('');

    // 1. "Advanced matching" pixel: hashes the email as soon as you leave the field (like Meta / TikTok).
    document.getElementById('email').addEventListener('blur', async (e) => {
      const em = await sha256(e.target.value.trim().toLowerCase());
      new Image().src = `https://example.net/pixel.gif?ev=Lead&em=${em}`;
    });

    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      // 2. Analytics "identify" call with the plain email in a JSON body (like Segment).
      fetch('https://httpbin.org/post', { method: 'POST', body: JSON.stringify({ type: 'identify', traits: { email, phone } }) });
      // 3. Beacon with a base64-encoded payload.
      navigator.sendBeacon('https://example.org/collect', btoa(JSON.stringify({ user: { email } })));
      // 4. Session-replay style: gzip-compressed batch of recorded keystrokes.
      const gz = new Blob([JSON.stringify({ events: [{ type: 'input', value: email }] })])
        .stream().pipeThrough(new CompressionStream('gzip'));
      new Response(gz).arrayBuffer().then((body) =>
        fetch('https://httpbin.org/anything/replay', { method: 'POST', body }));
      // 5. A tracker that receives nothing personal — should show under "other third parties".
      new Image().src = 'https://example.com/ping.gif?page=signup';
      alert('Submitted — open the DataTag popup.');
    });
  </script>
</body>
</html>
