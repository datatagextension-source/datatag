<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DataTag promo tile</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      background: #16181d; color: #ececec; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; justify-content: center; padding: 0 40px; box-sizing: border-box;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    img { width: 64px; height: 64px; }
    .name { font-size: 38px; font-weight: 800; letter-spacing: -.02em; }
    p { font-size: 21px; line-height: 1.35; color: #a6a8ad; margin: 22px 0 0; }
    p b { color: #ff6b5e; font-weight: 700; }
  </style>
</head>
<body>
  <div class="brand"><img src="../../icons/icon128.png" alt=""><span class="name">DataTag</span></div>
  <p>See which companies get your email <b>the moment you type it.</b></p>
</body>
</html>
